name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Property & Integration Tests
        run: npm test
        env:
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long_ci!
          JWT_REFRESH_SECRET: test_refresh_secret_must_be_at_least_32_characters_long_ci!
          ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
          EMAIL_HOST: smtp.example.com
          EMAIL_PORT: 587
          EMAIL_USER: test
          EMAIL_PASS: test
          EMAIL_FROM: test@example.com

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint (Zero-Tolerance)
        run: npm run lint

      - name: Run Frontend Vitest Suite
        run: npm test

      - name: Run Production Build
        run: npm run build
