version: '3.9'

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:

services:
  # ── MongoDB ──────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  # ── Backend (Express + Node) ─────────────────────────────────
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    networks:
      - app-network

  # ── Frontend (Nginx serving React build) ─────────────────────
  frontend:
    build: ./frontend
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - app-network
